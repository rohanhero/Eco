<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eco Admin Redirect</title>
    <style>
      body {
        font-family: Inter, system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f8fafc;
        color: #111827;
      }
      .card {
        max-width: 520px;
        width: 100%;
        background: white;
        border-radius: 24px;
        box-shadow: 0 30px 60px rgba(15, 23, 42, 0.08);
        padding: 32px;
      }
      a {
        color: #2563eb;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Eco Admin</h1>
      <p>The custom admin panel is available from the React frontend.</p>
      <p>
        If you are running the frontend dev server, you will be redirected
        shortly.
      </p>
      <p>If it does not redirect automatically, click here:</p>
      <p><a href="http://localhost:5173/admin">Open React admin</a></p>
    </div>

    <script>
      window.location.href = "http://localhost:5173/admin";
    </script>
  </body>
</html>
